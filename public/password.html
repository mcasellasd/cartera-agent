<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8" />
<title>Accés</title>
<style>
:root{--bg:#f5f6f8;--panel:#ffffff;--line:#d0d7de;--txt:#1f2328;--acc:#0969da;}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;}
.container{background:var(--panel);padding:30px 40px;border:1px solid var(--line);border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.08);}
input{padding:8px 10px;border:1px solid var(--line);border-radius:6px;width:200px;font-size:14px;}
button{margin-left:8px;padding:8px 12px;background:var(--acc);color:#fff;border:none;border-radius:6px;cursor:pointer;}
.error{color:#cf222e;margin-top:8px;font-size:13px;}
button:disabled{opacity:.55;cursor:default}
</style>
</head>
<body>
<div class="container">
  <h2>Introdueix la contrasenya</h2>
  <input type="password" id="pwd" placeholder="codi" />
  <button id="enter">Entrar</button>
  <div id="msg" class="error" style="display:none;"></div>
</div>
<script>
const pwd = document.getElementById('pwd');
const btn = document.getElementById('enter');
const msg = document.getElementById('msg');
async function entra(){
  msg.style.display = 'none';
  btn.disabled = true;
  try {
    const response = await fetch('/api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({password: pwd.value})
    });
    const result = await response.json().catch(()=>({}));
    if (!response.ok) throw new Error(result.error || 'No s’ha pogut iniciar la sessió.');
    window.location.href = '/';
  } catch (error) {
    msg.textContent = error.message;
    msg.style.display = 'block';
    pwd.select();
  } finally {
    btn.disabled = false;
  }
}
btn.addEventListener('click', entra);
pwd.addEventListener('keydown', event=>{ if(event.key === 'Enter') entra(); });
</script>
</body>
</html>
